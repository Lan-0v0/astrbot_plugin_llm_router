name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pyyaml

      - name: Validate release version
        shell: bash
        run: |
          METADATA_VERSION="$(python -c 'import yaml; print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["version"])')"
          if [[ -n "${RELEASE_TAG}" && "${METADATA_VERSION}" != "${RELEASE_TAG}" ]]; then
            echo "metadata.yaml version ${METADATA_VERSION} does not match release ${RELEASE_TAG}."
            exit 1
          fi

      - name: Run release checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .
          ruff check .
          ruff format --check .

      - name: Build AstrBot plugin archive
        shell: bash
        run: |
          ARCHIVE_NAME="astrbot_plugin_llm_router-${RELEASE_TAG}.zip"
          git archive --format=zip --prefix=astrbot_plugin_llm_router/ -o "${ARCHIVE_NAME}" HEAD
          ARCHIVE_SIZE="$(stat -c%s "${ARCHIVE_NAME}")"
          if (( ARCHIVE_SIZE > 16777216 )); then
            echo "Release archive exceeds AstrBot's 16 MB limit."
            exit 1
          fi
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "${GITHUB_ENV}"

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: false
