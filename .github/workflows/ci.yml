name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pyyaml

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run syntax smoke test
        run: python -m compileall -q .

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Validate plugin metadata and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          metadata = yaml.safe_load(Path("metadata.yaml").read_text(encoding="utf-8"))
          schema = json.loads(Path("_conf_schema.json").read_text(encoding="utf-8"))

          assert metadata["name"] == "astrbot_plugin_llm_router"
          assert metadata["version"] == "v0.0.1"
          assert metadata["repo"] == "https://github.com/Lan-0v0/astrbot_plugin_llm_router"
          assert schema["routing_models"]["type"] == "template_list"
          PY
