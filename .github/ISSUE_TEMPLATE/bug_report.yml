name: Bug 报告
description: 报告可以稳定复现的插件问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题。请先删除日志中的 API Key、令牌、用户隐私和聊天内容。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: v0.0.1
    validations:
      required: true
  - type: input
    id: astrbot-version
    attributes:
      label: AstrBot 版本
      placeholder: v4.x.x
    validations:
      required: true
  - type: dropdown
    id: route-provider
    attributes:
      label: 路由模型类型
      options:
        - OpenAI 兼容
        - Gemini
        - DeepSeek
        - Zhipu
        - 与路由模型无关
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定的复现步骤和已脱敏配置。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请务必移除 API Key、Authorization 头和私人消息。
      render: shell
